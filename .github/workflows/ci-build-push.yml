name: CI Build and Push to GHCR

on:
  push:
    branches: [ "master" ]

jobs:
  ci-build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # 1. Install dependencies
      # -------------------------
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      # -------------------------
      # 2. Run tests (excluding RequiresDatabase)
      # -------------------------
      - name: Run tests (no DB tests)
        run: dotnet test --no-build --verbosity normal --filter "Category!=RequiresDatabase"

      # -------------------------
      # 3. Set up Docker Buildx
      # -------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -------------------------
      # 4. Log in to GHCR
      # -------------------------
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # -------------------------
      # 5. Build & Push with caching
      # -------------------------
      - name: Build and Push Docker image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GIT_HASH=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/thevillagecc-api:latest
            ghcr.io/${{ github.repository_owner }}/thevillagecc-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
