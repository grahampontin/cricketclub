name: Promote to Prod

on:
  workflow_dispatch:

jobs:
  promote:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest successful CI SHA
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(gh run list \
            --workflow "CI Build and Push to GHCR" \
            --branch main \
            --json headSha,conclusion \
            --jq '[.[] | select(.conclusion=="success") | .headSha][0]' )
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Prod ACA
        run: |
          IMAGE="ghcr.io/grahampontin/thevillagecc-api:${{ steps.fetch.outputs.sha }}"
          echo "Deploying image: $IMAGE"

          az containerapp update \
            --name villagecc-api \
            --resource-group Village_CC \
            --image $IMAGE \
            --registry-server ghcr.io \
            --registry-username ${{ secrets.GHCR_USERNAME }} \
            --registry-password ${{ secrets.GHCR_PAT }}

      - name: Show latest revision
        run: |
          az containerapp revision list \
            --name villagecc-api \
            --resource-group Village_CC \
            --query "[?active].{revisionName:name,image:template.containers[0].image}"
