name: Promote to Prod

on:
  workflow_dispatch:

jobs:
  select-sha:
    runs-on: ubuntu-latest
    outputs:
      selected_sha: ${{ steps.user_select.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch last 10 successful CI SHAs
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHAS=$(gh run list \
            --workflow "CI Build and Push to GHCR" \
            --branch main \
            --json headSha,conclusion \
            --jq '[.[] | select(.conclusion=="success") | .headSha][0:10]')
          echo "sha_list=$SHAS" >> $GITHUB_OUTPUT

      - name: Ask user to choose SHA
        id: user_select
        uses: actions/github-script@v7
        with:
          script: |
            const shas = JSON.parse(process.env.SHA_LIST);
            const choice = await core.prompt({
              type: 'select',
              message: 'Select a build to promote to PROD',
              options: shas
            });
            core.setOutput('sha', choice);
        env:
          SHA_LIST: ${{ steps.fetch.outputs.sha_list }}

  deploy:
    needs: select-sha
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Prod ACA
        run: |
          IMAGE="ghcr.io/grahampontin/thevillagecc-api:${{ needs.select-sha.outputs.selected_sha }}"
          echo "Deploying image: $IMAGE"

          az containerapp update \
            --name villagecc-api \
            --resource-group Village_CC \
            --image $IMAGE \
            --registry-server ghcr.io \
            --registry-username ${{ secrets.GHCR_USERNAME }} \
            --registry-password ${{ secrets.GHCR_PAT }}

      - name: Show latest revision
        run: |
          az containerapp revision list \
            --name villagecc-api \
            --resource-group Village_CC \
            --query "[?active].{revisionName:name,image:template.containers[0].image}"
