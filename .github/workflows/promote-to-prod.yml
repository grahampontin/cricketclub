name: Promote to Prod

on:
  workflow_dispatch:
    inputs:
      sha:
        type: choice
        description: "Select a build to promote"
        options: []

jobs:
  load-shas:
    runs-on: ubuntu-latest
    outputs:
      sha_list: ${{ steps.collect.outputs.sha_list }}

    steps:
      - name: Fetch last 10 successful CI SHAs
        id: collect
        run: |
          SHAS=$(gh run list \
            --workflow "CI Build and Push to GHCR" \
            --branch main \
            --json headSha,conclusion \
            --jq '[.[] | select(.conclusion=="success") | .headSha][0:10]')
          
          echo "sha_list=$SHAS" >> $GITHUB_OUTPUT

  promote:
    needs: load-shas
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Convert SHAs to dropdown
        id: dropdown
        run: |
          echo "options<<EOF" >> $GITHUB_OUTPUT
          echo "${{ needs.load-shas.outputs.sha_list }}" | jq -r '.[]' >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Prod ACA
        run: |
          IMAGE="ghcr.io/grahampontin/thevillagecc-api:${{ github.event.inputs.sha }}"
          echo "Deploying image: $IMAGE"

          az containerapp update \
            --name villagecc-api \
            --resource-group Village_CC \
            --image $IMAGE \
            --registry-server ghcr.io \
            --registry-username ${{ secrets.GHCR_USERNAME }} \
            --registry-password ${{ secrets.GHCR_PAT }}

      - name: Show latest revision
        run: |
          az containerapp revision list \
            --name villagecc-api \
            --resource-group Village_CC \
            --query "[?active].{revisionName:name,image:template.containers[0].image}"
