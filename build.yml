# .NET Desktop
# Build and run tests for .NET Desktop or Windows classic desktop solutions.
# Add steps that publish symbols, save build artifacts, and more:
# https://docs.microsoft.com/azure/devops/pipelines/apps/windows/dot-net

trigger:
- master

# Run build/test on PRs, but don't deploy.
pr:
- master

pool:
  vmImage: 'ubuntu-latest'

variables:
  solution: '**/*.sln'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'

  # Docker/ACR settings (set these in pipeline variables or a variable group)
  acrLoginServer: 'villagecc.azurecr.io'
  imageRepository: 'cricketclub-webapi'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  imageTag: '$(Build.BuildId)'

  # Service connections / deployment target (set these in pipeline variables)
  acrServiceConnection: 'sc-acr'
  azureSubscription: 'Azure subscription 1(0b646bd8-47ab-4d11-be2a-70bc63346592)'

  # Azure Container Apps deployment target (set these in pipeline variables)
  resourceGroup: 'Village_CC'
  containerAppName: 'thevillagecc-webapi'
  containerName: 'webapi'

  # Azure Artifacts feed (NuGet v3) for dotnet nuget push
  artifactsFeedUrl: 'https://pkgs.dev.azure.com/grahampontin/109e362b-62db-4727-9d2a-e2d0e8f55904/_packaging/CricketClubCore/nuget/v3/index.json'

steps:
- task: UseDotNet@2
  displayName: Use .NET SDK
  inputs:
    packageType: 'sdk'
    version: '9.x'

- task: DotNetCoreCLI@2
  displayName: Restore
  inputs:
    command: 'restore'
    projects: '$(solution)'

- task: DotNetCoreCLI@2
  displayName: Build
  inputs:
    command: 'build'
    projects: '$(solution)'
    arguments: '--configuration $(buildConfiguration)'

- task: DotNetCoreCLI@2
  displayName: Test (exclude RequiresDatabase)
  inputs:
    command: 'test'
    projects: '$(solution)'
    arguments: '--configuration $(buildConfiguration) --filter "TestCategory!=RequiresDatabase"'

- task: DotNetCoreCLI@2
  displayName: Pack
  inputs:
    command: 'pack'
    packagesToPack: '**/*.csproj'
    versioningScheme: 'byPrereleaseNumber'
    majorVersion: '1'
    minorVersion: '0'
    patchVersion: '0'

# Push packages (cross-platform)
- task: DotNetCoreCLI@2
  displayName: Push packages
  inputs:
    command: 'custom'
    custom: 'nuget'
    arguments: >
      push "$(Build.ArtifactStagingDirectory)/**/*.nupkg"
      --source "$(artifactsFeedUrl)"
      --skip-duplicate
      --api-key "AzureDevOps"

- task: Docker@2
  displayName: Build and push WebApi container image to ACR
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
  inputs:
    command: buildAndPush
    containerRegistry: '$(acrServiceConnection)'
    repository: '$(imageRepository)'
    Dockerfile: '$(dockerfilePath)'
    buildContext: '$(Build.SourcesDirectory)'
    tags: |
      $(imageTag)
      latest

# Deploy to Azure Container Apps
- task: AzureCLI@2
  displayName: Deploy WebApi container to Azure Container Apps
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
  inputs:
    azureSubscription: '$(azureSubscription)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      set -euo pipefail
      az containerapp update \
        --resource-group "$(resourceGroup)" \
        --name "$(containerAppName)" \
        --image "$(acrLoginServer)/$(imageRepository):$(imageTag)" \
        --container-name "$(containerName)"
